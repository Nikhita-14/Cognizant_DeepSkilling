# Spring Framework and application log logging strategies
logging.level.org.springframework=info
logging.level.com.cognizant=debug

# Hibernate logs to trace runtime generated SQL structures and parameters
logging.level.org.hibernate.SQL=trace
logging.level.org.hibernate.type.descriptor.sql=trace

# Target console pattern layout format
logging.pattern.console=%d{dd-MM-yy} %d{HH:mm:ss.SSS} [%thread] %5p %-25.25logger{25} - %m%n

# Core MySQL Database Resource parameters
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ormlearn?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# Hibernate runtime validation and dialect configuration properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect